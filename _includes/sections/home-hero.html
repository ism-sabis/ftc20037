<section class="relative overflow-hidden bg-[var(--color-surface)] dark:bg-[var(--color-background)]">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 md:py-28 lg:py-36">
    <div class="grid md:grid-cols-2 gap-12 items-center">
      <!-- Left: Content -->
      <div>
        <!-- Team badge -->
        <span class="inline-flex items-center px-3 py-1 rounded-sm text-xs font-mono tracking-wide uppercase bg-[var(--color-surface-elevated)] text-[var(--color-text-muted)] mb-6">
          {{ site.site.program }} Team #{{ site.site.team_number }}
        </span>
        
        <!-- Main heading -->
        <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold text-[var(--color-text)] leading-tight mb-6">
          {{ site.site.team_name }}
        </h1>
        
        <!-- Subtitle -->
        <p class="text-lg text-[var(--color-text-muted)] mb-8 max-w-md leading-relaxed">
          {{ site.description | default: "Building robots, inspiring futures, and making a difference in our community." }}
        </p>
        
        <!-- CTA buttons -->
        <div class="flex flex-wrap gap-3">
          <a href="{{ '/about/' | relative_url }}" class="inline-flex items-center px-6 py-2.5 bg-[var(--color-accent)] hover:bg-[var(--color-accent-dark)] text-white font-medium rounded-sm transition-colors focus-visible:ring-2 focus-visible:ring-[var(--color-accent)]">
            Meet the Team
          </a>
          <a href="{{ '/season/' | relative_url }}" class="inline-flex items-center px-6 py-2.5 border-2 border-[var(--color-primary)] text-[var(--color-primary)] hover:bg-[var(--color-primary)] hover:text-white font-medium rounded-sm transition-colors focus-visible:ring-2 focus-visible:ring-[var(--color-accent)]">
            Current Season
          </a>
        </div>
      </div>

      <!-- Right: Logo/Visual -->
      <div class="flex justify-center md:justify-end">
        <div class="relative w-64 h-64 md:w-80 md:h-80">
          <!-- Background accent -->
          <div class="absolute inset-0 bg-gradient-to-br from-red-100 to-red-50 dark:from-red-950/30 dark:to-gray-800 rounded-2xl transform rotate-6"></div>
          <!-- Logo image -->
          <img
            src="{{ site.site.logo | default: '/assets/images/placeholder.svg' | relative_url }}"
            alt="{{ site.site.team_name }} logo"
            class="relative w-full h-full object-cover rounded-2xl shadow-lg ring-1 ring-gray-200 dark:ring-gray-700"
          >
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom wave -->
  <div class="absolute bottom-0 left-0 right-0">
    <svg viewBox="0 0 1440 80" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto" preserveAspectRatio="none">
      <path d="M0 80L48 74.7C96 69 192 59 288 53.3C384 48 480 48 576 53.3C672 59 768 69 864 69.3C960 69 1056 59 1152 53.3C1248 48 1344 48 1392 48L1440 48V80H1392C1344 80 1248 80 1152 80C1056 80 960 80 864 80C768 80 672 80 576 80C480 80 384 80 288 80C192 80 96 80 48 80H0Z" fill="var(--color-surface, #f9fafb)"/>
    </svg>
  </div>
</section>
