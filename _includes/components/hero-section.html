<section class="relative overflow-hidden" style="background: var(--gradient-hero);">
  <!-- Circuit-board pattern overlay -->
  <svg class="absolute inset-0 w-full h-full opacity-[0.03] pointer-events-none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="circuit-pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M0 20h15M25 20h15M20 0v15M20 25v15" stroke="#06D6A0" stroke-width="0.5" fill="none"/>
        <circle cx="20" cy="20" r="2" fill="#06D6A0" opacity="0.5"/>
        <circle cx="0" cy="20" r="1.5" fill="#06D6A0" opacity="0.3"/>
        <circle cx="40" cy="20" r="1.5" fill="#06D6A0" opacity="0.3"/>
        <circle cx="20" cy="0" r="1.5" fill="#06D6A0" opacity="0.3"/>
        <circle cx="20" cy="40" r="1.5" fill="#06D6A0" opacity="0.3"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#circuit-pattern)"/>
  </svg>

  <!-- Cyan accent line at bottom -->
  <div class="absolute bottom-0 left-0 right-0 h-0.5 bg-[var(--color-accent)]"></div>

  <div class="relative container py-20 md:py-32">
    <div class="max-w-3xl">
      <div class="flex flex-wrap items-center gap-2 mb-6">
        <span class="px-3 py-1 rounded-sm bg-white/10 text-white text-xs font-mono tracking-wide uppercase">{{ site.site.program }} Team #{{ site.site.team_number }}</span>
        <span class="px-3 py-1 rounded-sm bg-[var(--color-accent)] text-[var(--color-primary)] text-xs font-bold">{{ site.site.current_season }}</span>
      </div>

      <h1 class="text-4xl md:text-6xl font-bold mb-6 text-white tracking-tight">
        {{ site.site.team_name }}
      </h1>

      <!-- Cyan accent bar under heading -->
      <div class="w-12 h-0.5 bg-[var(--color-accent)] mb-4"></div>

      <p class="text-xl md:text-2xl mb-8 text-white/90 leading-relaxed">
        {{ site.description | default: "Building robots. Building futures. Building community." }}
      </p>

      <div class="flex flex-col sm:flex-row gap-4">
        <a href="{{ '/season/' | relative_url }}" class="btn bg-[var(--color-accent)] text-[var(--color-primary)] hover:bg-[var(--color-accent-dark)] font-semibold px-6 py-3 rounded-sm">
          Current Season
        </a>
        <a href="{{ '/about/' | relative_url }}" class="btn border-2 border-white/30 text-white hover:border-white hover:bg-white/10 font-semibold px-6 py-3 rounded-sm transition-all duration-200">
          Meet the Team
        </a>
      </div>
    </div>
  </div>

  <!-- Decorative Elements -->
  <div class="absolute -bottom-10 -right-10 w-64 h-64 bg-[var(--color-accent)]/10 rounded-full blur-3xl"></div>
  <div class="absolute -top-20 -left-20 w-80 h-80 bg-white/5 rounded-full blur-3xl"></div>
  <div class="absolute bottom-2 left-0 right-0 h-24 bg-gradient-to-t from-[var(--color-background)] to-transparent"></div>
</section>
