# Site settings
title: "Standard Deviation"
description: "A FIRST robotics team dedicated to inspiring students in science, technology, engineering, and math." #https://github.com/braineatingmachines/pitcrew
url: ""
baseurl: ""

# Team configuration
site:
  team_name: "Standard Deviation"
  team_number: "20037"
  program: "FTC"  # FTC or FRC
  current_season: "2025-2026"
  logo: "/assets/images/teamLogoCropped.jpg"

# Theme palette - Official FTC Colors
palette:
  colors:
    primary: "#003974"    # Deep Blue
    secondary: "#F57E25"  # FIRST Orange (brand color)
    success: "#28a745"    # Success green
    info: "#17a2b8"       # Info teal
    warning: "#f0b37e"    # Warning orange
    danger: "#dc3545"     # Danger red
  dark_mode: true

# Features toggle
features:
  blog: false
  docs: false
  cad_viewer: true
  circuit_viewer: true
  code_links: false
  data_visualizations: true
  alumni_auto_archive: true
  accessibility_toggle: true
  search: true

# Navigation
navigation:
  - id: home
    title: Home
    url: /
  - id: about
    title: About
    url: /about/
  - id: season
    title: Season
    url: /season/
  - id: awards
    title: Awards
    url: /awards/
  - id: sponsors
    title: Sponsors
    url: /sponsors/
  - id: docs
    title: Docs
    url: /docs/
  - id: portfolio
    title: Portfolio
    url: /portfolio/
  - id: gallery
    title: Gallery
    url: /gallery/
  - id: news
    title: News
    url: /news/
  - id: contact
    title: Contact
    url: /contact/

# Social links
socials:
  instagram: "https://www.instagram.com/ismroboticsclub"
  github: "https://github.com/ism-sabis"
 # youtube: "https://youtube.com/@teamrobotics"
 # twitter: "https://twitter.com/teamrobotics"
  email: "ftc20037@ism-sabis.net"

# Fundraising/Donations
fundraising:
  enabled: false
  url: ""
  text: "Support Our Team"

# Collections
collections:
  posts:
    output: false
    permalink: /news/:year/:month/:day/:title/
  seasons:
    output: true
    permalink: /seasons/:path/
  docs:
    output: false
    permalink: /docs/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "seasons"
    values:
      layout: "season"
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "docs"

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Include in build
include:
  - assets

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - package.json
  - package-lock.json
  - tailwind.config.js
  - README.md
  - scripts
  - "*.py"
  - requirements.txt
