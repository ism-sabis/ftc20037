<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  {% seo %}
  {% feed_meta %}

  <link rel="stylesheet" href="{{ '/assets/css/output.css' | relative_url }}">

  <script>
    // Check for dark mode preference
    if (localStorage.getItem('darkMode') === 'true' ||
        (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
    // Check for accessibility mode
    if (localStorage.getItem('accessibilityMode') === 'true') {
      document.documentElement.classList.add('accessibility-mode');
    }
  </script>
</head>
<body class="bg-white dark:bg-black text-gray-900 dark:text-gray-100 min-h-screen flex flex-col antialiased">
  <a href="#main-content" class="skip-link sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-[100] focus:bg-red-600 focus:text-white focus:px-4 focus:py-2 focus:rounded-lg sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-[100] focus:bg-red-600 focus:text-white focus:px-4 focus:py-2 focus:rounded-lg">Skip to main content</a>

  {% include navigation.html %}

  <main id="main-content" class="flex-grow">
    {{ content }}
  </main>

  {% include footer.html %}

  {% include components/scroll-animations.html %}

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
