---
layout: default
---

<!-- Page Header with accent bar -->
{% if page.title %}
<section class="relative bg-gradient-to-r from-gray-50 to-white dark:from-gray-950 dark:to-gray-900 border-b border-gray-100 dark:border-gray-800">
  <div class="absolute left-0 top-0 bottom-0 w-1 bg-gradient-to-b from-red-600 to-[#F57E25]"></div>
  <div class="max-w-screen-xl mx-auto px-4 sm:px-6 lg:px-12 py-16">
    <h1 class="text-4xl md:text-5xl font-bold text-gray-900 dark:text-white tracking-tight">{{ page.title }}</h1>
    {% if page.description %}
    <p class="mt-3 text-lg text-gray-600 dark:text-gray-400 max-w-2xl">{{ page.description }}</p>
    {% endif %}
  </div>
</section>
{% endif %}

<!-- Page Content - Asymmetric layout -->
<section class="bg-white dark:bg-gray-950">
  <div class="max-w-screen-xl mx-auto px-4 sm:px-6 lg:px-12 py-16">
    <div class="grid lg:grid-cols-[1fr_200px] gap-12">
      <!-- Main content -->
      <article class="min-w-0">
        <div class="prose prose-lg max-w-none text-gray-700 dark:text-gray-300 prose-headings:font-bold prose-headings:text-gray-900 dark:prose-headings:text-white prose-a:text-red-600 dark:prose-a:text-red-400 prose-a:no-underline hover:prose-a:underline focus-visible:ring-2 focus-visible:ring-red-500 focus-visible:outline-none">
          {{ content }}
        </div>
      </article>

      <!-- Right sidebar - page metadata -->
      <aside class="hidden lg:block">
        <div class="sticky top-32 space-y-6">
          <!-- Page title reference -->
          <div class="p-4 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-100 dark:border-gray-800">
            <h3 class="text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-2">Section</h3>
            <p class="font-semibold text-gray-900 dark:text-white">{{ page.title }}</p>
          </div>

          <!-- Navigation back to home -->
          <a href="{{ '/' | relative_url }}" class="flex items-center gap-2 p-4 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-100 dark:border-gray-800 hover:border-red-200 dark:hover:border-red-900 transition-colors group">
            <svg class="h-4 w-4 text-gray-500 dark:text-gray-400 group-hover:text-red-600 dark:group-hover:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            <span class="text-sm font-medium text-gray-600 dark:text-gray-400 group-hover:text-red-600 dark:group-hover:text-red-400 transition-colors">Back to Home</span>
          </a>
        </div>
      </aside>
    </div>
  </div>
</section>
