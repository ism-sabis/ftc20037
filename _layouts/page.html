---
layout: default
---

<article class="py-12 bg-white dark:bg-gray-900">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    {% if page.title %}
    <header class="mb-8 text-center">
      <h1 class="text-3xl md:text-4xl font-bold text-gray-900 dark:text-white mb-2">{{ page.title }}</h1>
      {% if page.description %}
      <p class="text-lg text-gray-600 dark:text-gray-400">{{ page.description }}</p>
      {% endif %}
    </header>
    {% endif %}

    <div class="prose prose-lg max-w-none text-gray-700 dark:text-gray-300">
      {{ content }}
    </div>
  </div>
</article>
