---
layout: default
---

<article class="py-12 bg-[var(--color-surface)] dark:bg-[var(--color-background)]">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    {% if page.title %}
    <header class="mb-8 text-center">
      <h1 class="text-3xl md:text-4xl font-bold text-[var(--color-text)] mb-2">{{ page.title }}</h1>
      {% if page.description %}
      <p class="text-lg text-[var(--color-text-muted)]">{{ page.description }}</p>
      {% endif %}
    </header>
    {% endif %}

    <div class="max-w-none" style="color: var(--color-text);">
      {{ content }}
    </div>
  </div>
</article>
